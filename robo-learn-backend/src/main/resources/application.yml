spring:
  main:
    banner-mode: "off"
  application:
    name: RoboLearn API

  # PostgreSQL Configuration (Neon)
  datasource:
    url: ${DATABASE_URL:YOUR_DATABASE_URL}
    username: ${DATABASE_USERNAME:YOUR_DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD:YOUR_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    # Removed explicit dialect as Hibernate 6 auto-detects it correctly now

  # MongoDB Configuration (Polyglot Persistence)
  data:
    mongodb:
      uri: ${MONGODB_URI:YOUR_MONGODB_URI}

  # Security Configuration
  security:
    user:
      name: admin
      password: admin123

  # OpenAI Configuration (for AI Integration)
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:YOUR_OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4
          temperature: 0.7

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${KAFKA_ENABLED:false}
    admin:
      auto-create: ${KAFKA_ENABLED:false}
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: robolearn-execution-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.robolearn.api.dto.request"

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:YOUR_JWT_SECRET}
  expiration: 86400000 # 24 hours in milliseconds
  refreshExpiration: 604800000 # 7 days in milliseconds

# Server Configuration
server:
  port: ${PORT:8080}

# Multipart File Upload
spring.servlet.multipart:
  enabled: true
  max-file-size: 10MB
  max-request-size: 10MB

# Cloudinary Configuration
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:YOUR_CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY:YOUR_CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET:YOUR_CLOUDINARY_API_SECRET}

# Logging Configuration
logging:
  level:
    root: INFO
    com.robolearn: DEBUG
    org.springframework.security: DEBUG
    org.apache.kafka: ERROR
    org.springframework.kafka: ERROR
    org.hibernate.orm.deprecation: ERROR
  pattern:
    console: "[%d{yyyy-MM-dd HH:mm:ss}] [%thread] %-5level %logger{36} - %msg%n"
