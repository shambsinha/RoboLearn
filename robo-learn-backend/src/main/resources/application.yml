spring:
  main:
    banner-mode: "off"
  application:
    name: RoboLearn API

  # PostgreSQL Configuration (Neon)
  datasource:
    url: ${DATABASE_URL:YOUR_DATABASE_URL}
    username: ${DATABASE_USERNAME:YOUR_DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD:YOUR_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
      jakarta:
        persistence:
          jdbc:
            url: ${DATABASE_URL:YOUR_DATABASE_URL}
            user: ${DATABASE_USERNAME:YOUR_DATABASE_USERNAME}
            password: ${DATABASE_PASSWORD:YOUR_DATABASE_PASSWORD}

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

  # MongoDB Configuration (SB 4.0 uses spring.mongodb namespace)
  mongodb:
    uri: ${MONGODB_URI:YOUR_MONGODB_URI}

  # Unified Data Configuration (Redis remains under spring.data)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # Security Configuration
  security:
    user:
      name: admin
      password: admin123

  # OpenAI Configuration (for AI Integration)
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:YOUR_OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4
          temperature: 0.7

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${KAFKA_ENABLED:false}
    admin:
      auto-create: ${KAFKA_ENABLED:false}
      fail-fast: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: robolearn-execution-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.robolearn"

  # Mail Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:YOUR_EMAIL}
    password: ${MAIL_PASSWORD:YOUR_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Caching Configuration (Auto-detects Redis, falls back to Simple)
  cache:
    redis:
      time-to-live: 3600000 # 1 hour default TTL
      cache-null-values: false

  # Multipart File Upload
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:robolearn_secure_high_entropy_key_v1_2026_neural_link}
  expiration: 86400000 # 24 hours in milliseconds
  refreshExpiration: 604800000 # 7 days in milliseconds

# Server Configuration
server:
  port: ${PORT:8080}

# Cloudinary Configuration
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:YOUR_CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY:YOUR_CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET:YOUR_CLOUDINARY_API_SECRET}

# Google Auth Configuration
google:
  client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}

# Logging Configuration
logging:
  level:
    root: INFO
    com.robolearn: DEBUG
    org.flywaydb: DEBUG
    org.springframework.security: DEBUG
    org.apache.kafka: ERROR
    org.springframework.kafka: ERROR
    org.hibernate.orm.deprecation: ERROR
  pattern:
    console: "[%d{yyyy-MM-dd HH:mm:ss}] [%thread] %-5level %logger{36} - %msg%n"

# Application Custom Properties
app:
  seeder:
    enabled: ${SEEDER_ENABLED:false}
