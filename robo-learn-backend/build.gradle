plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.robolearn'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

// THIS IS THE MISSING BLOCK: It forces Gradle to use the 1.0.0-M1 versions for all AI packages
ext {
    set('springAiVersion', "1.0.0-M1")
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {
    // Spring Boot Web Starter
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Spring Boot Data JPA
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Spring Boot Data MongoDB (Polyglot Persistence)
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    // PostgreSQL Driver
    runtimeOnly 'org.postgresql:postgresql:42.7.0'

    // Spring Boot Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JWT Dependencies (jjwt)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // Spring Boot Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // WebSockets
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Email Support
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Redis & Caching
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Dotenv support for local environment variables
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // Cloudinary SDK
    implementation 'com.cloudinary:cloudinary-http44:1.36.0'

    // Google API Client for Token Verification
    implementation 'com.google.api-client:google-api-client:2.2.0'

    // Spring AI (for OpenAI integration) - VERSION HANDLED BY BOM NOW
    implementation 'org.springframework.ai:spring-ai-openai-spring-boot-starter'

    // JSON Processing (Jackson)
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // H2 Database (for testing)
    runtimeOnly 'com.h2database:h2'

    // Spring Boot Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

    // Spring Security Test
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootRun') {
    systemProperty 'spring.profiles.active', findProperty('spring.profiles.active') ?: 'dev'
    // Optimized memory and GC for low-resource environments
    jvmArgs = ["-Xms512m", "-Xmx1536m", "-XX:ParallelGCThreads=2", "-XX:ConcGCThreads=1"]
}

// Build info
springBoot {
    buildInfo()
}